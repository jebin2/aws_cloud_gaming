# Every push to main and every pull request runs the whole suite, so a break is
# found by a red check and not by the person who next tries to use cg.
#
# It is the same command a person runs: `bash tests/run-all.sh` builds cg, runs
# `go test ./...`, then the shell and DOM suites. Nothing here touches AWS - the
# suites use fakes and stubs - so it costs nothing but runner minutes, which are
# free on a public repository.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow calls this one, so a tag cannot build a package that
  # `main` would not have passed.
  workflow_call:
    secrets:
      GUARD_EXTRA:
        required: false

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go and shell suites
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install App Dependencies
        working-directory: ./app
        run: npm ci

      # The app's stylesheet is generated, and nothing in the suites below builds it,
      # so a dependency update that breaks the build passed every check: Tailwind 4
      # removed the command this runs, and its pull request was green. `npm start`,
      # `npm run dist` and the release all run it first.
      - name: Build The App's CSS
        working-directory: ./app
        run: |
          npm run build:css
          test -s renderer/tailwind.css
        shell: bash

      # Formatting and vet first: they take seconds and say what is wrong in
      # plain words, where a failing suite says it in a log.
      - name: Format And Vet
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [[ -n $unformatted ]]; then
            echo "gofmt would change:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
          go vet ./...
        shell: bash

      # RUN UNPIPED: the script's exit status is the point (see its header).
      # A failed suite's whole output is folded into this log, listed on the run's
      # summary page with its time, and kept as a download below.
      - name: Run Every Suite
        run: bash tests/run-all.sh
        shell: bash
        env:
          TEST_LOGS_DIR: ${{ runner.temp }}/test-logs
          # The owner's own identifiers, as a regex, for tests/secrets-guard.sh.
          # A repository secret, never a file: written into the repo it would be
          # the leak it looks for. Unset, only the generic key shapes are checked.
          GUARD_EXTRA: ${{ secrets.GUARD_EXTRA }}

      - name: Keep The Failed Suites' Output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failed-suites
          path: ${{ runner.temp }}/test-logs
          if-no-files-found: ignore
          retention-days: 14
