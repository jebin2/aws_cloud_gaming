# Tag a version, get a Linux build.
#
#     git tag v0.2.0 && git push origin v0.2.0
#
# The tag is the version: package.json is stamped from it, so an installed
# build can say which one it is. The release is a DRAFT - look at it, write
# what changed, then publish.
#
# LINUX ONLY, deliberately. electron-builder will happily produce a .exe and a
# .dmg, and both would be untested downloads: macOS has never been tried, and
# on Windows the app shells through WSL while Stop kills a POSIX process group
# that cannot reach inside it. Shipping them would be shipping a guess. The
# matrix below is one line away from all three - add them back when someone has
# actually run the thing on that machine.
#
# Free: GitHub Actions costs nothing on a public repository.
name: Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]   # windows-latest, macos-latest: untested, see the header

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      # The app must never grow AWS logic, and it must never hold a price -
      # both are checked by this suite. A release that fails it is a release
      # that broke the one rule the design has.
      - name: Check The App Still Only Runs cg
        run: |
          (cd app && npm ci)
          bash tests/app.sh
        shell: bash

      # The tag is the source of truth for the version. Without this the
      # version is whatever was committed, so every release reports the same
      # number and nothing in an installed build says which one it is.
      - name: Stamp Version From Tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: ./app
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"
        shell: bash

      - name: Install Dependencies
        working-directory: ./app
        run: npm ci

      - name: Build (Linux)
        working-directory: ./app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --linux --publish never

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            app/dist/*.AppImage
            app/dist/*.deb
            app/dist/*.pacman
            app/dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display Structure
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.pacman
            artifacts/**/*.tar.gz
          # Said on every release: what the download actually is, and what it
          # still needs from you before it can build anything on AWS.
          body: |
            ## Self-contained

            The scripts travel with the app - `cg`, `lib/` and the Lambda are inside the
            download, so it runs without a checkout. It still holds no AWS logic of its own:
            the app shells out to those scripts, and they remain the only thing that decides
            anything.

            Settings are written to `~/.config/cg/.env`, not next to the app, because an
            installed copy is read-only. A checkout keeps using its own `.env` as before, and
            a checkout beside the app wins over the bundled copy - so running from source
            shows your edits.

            ## Which file

            | | |
            |---|---|
            | `.pacman` | Arch, CachyOS, Omarchy - `sudo pacman -U <file>` |
            | `.deb` | Debian, Ubuntu, Mint - `sudo dpkg -i <file>` |
            | `.tar.gz` | anything else - extract it and run `cg` inside |
            | `.AppImage` | one file, but it needs FUSE 2 on the machine |

            The AppImage is listed last on purpose. AppImage type-2 needs `libfuse.so.2`, which
            distributions have largely moved past - on Arch that means `pacman -S fuse2` first,
            or running it as `./cg-*.AppImage --appimage-extract-and-run`. The `.tar.gz` needs
            nothing at all.

            ## Before it can build a box

            It needs an AWS account, a Tailscale auth key and the local tools. The app's
            Settings screen asks for each one, or:

                ./cg check --fix

            ## Linux only

            These are the only builds published, because Linux is the only place the app has
            been run. It is Electron and the scripts are bash, so macOS and Windows (through
            WSL) are within reach - but an untested download is worse than none, so they are
            not built until someone has actually used one.

            From source on any platform: `cd app && npm install && npm start`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
