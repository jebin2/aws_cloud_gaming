# Tag a version, get a Linux build.
#
#     git tag v0.2.0 && git push origin v0.2.0
#
# The tag is the version: package.json is stamped from it, so an installed
# build can say which one it is. The release is a DRAFT - look at it, write
# what changed, then publish.
#
# Three platforms: Linux (AppImage, deb, pacman, tar.gz), macOS (a .dmg for Intel and one
# for Apple Silicon) and Windows (one portable .exe). cg itself - the program the
# app runs - has been run through a full build, play and delete on a real Mac and a
# real Windows PC; the desktop app on those two has been BUILT here but not yet used by
# a person, and the release notes say so. The macOS and Windows files are not signed.
#
# Run it by hand (Actions > Desktop Release > Run workflow) to get the builds as
# downloads of the run, without a release: only a v* tag publishes a draft.
#
# Free: GitHub Actions costs nothing on a public repository.
name: Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The whole suite first (gofmt, vet, go test, every shell and DOM suite, the
  # secrets guard). Before this the release ran one suite, tests/app.sh, so a
  # tagged package could ship with a failing test.
  test:
    name: Tests
    uses: ./.github/workflows/test.yml
    secrets: inherit

  build-linux:
    name: Build Linux
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The app must never grow AWS logic, and it must never hold a price -
      # both are checked by this suite. A release that fails it is a release
      # that broke the one rule the design has.
      - name: Check The App Still Only Runs cg
        run: |
          (cd app && npm ci)
          go build -o cg ./cmd/cg
          bash tests/app.sh
        shell: bash

      # The tag is the source of truth for the version. Without this the
      # version is whatever was committed, so every release reports the same
      # number and nothing in an installed build says which one it is.
      - name: Stamp Version From Tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: ./app
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"
        shell: bash

      - name: Install Dependencies
        working-directory: ./app
        run: npm ci

      # fpm builds the Arch package by shelling out to bsdtar for its .MTREE,
      # and the Ubuntu runner has no bsdtar - the step died with exit code 127,
      # "command not found", after four minutes of building everything else.
      # It is present on Arch, which is why this only failed in CI.
      - name: Install Packaging Tools
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools
        shell: bash

      - name: Build (Linux)
        working-directory: ./app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --linux --publish never

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-artifacts
          path: |
            app/dist/*.AppImage
            app/dist/*.deb
            app/dist/*.pacman
            app/dist/*.tar.gz
          if-no-files-found: error

  build-macos:
    name: Build macOS
    needs: test
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Stamp Version From Tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: ./app
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"
        shell: bash

      - name: Install Dependencies
        working-directory: ./app
        run: npm ci

      # One runner makes both apps: the Apple Silicon one natively, the Intel one
      # cross-built (cg is Go, Electron ships both). Each gets the cg for its own
      # architecture, so the DMG for an Intel iMac carries an Intel cg.
      - name: Build (macOS, Apple Silicon)
        working-directory: ./app
        env:
          CG_GOARCH: arm64
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --mac --arm64 --publish never

      - name: Build (macOS, Intel)
        working-directory: ./app
        env:
          CG_GOARCH: amd64
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --mac --x64 --publish never

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-artifacts
          path: app/dist/*.dmg
          if-no-files-found: error

  build-windows:
    name: Build Windows
    needs: test
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Stamp Version From Tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: ./app
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"
        shell: bash

      - name: Install Dependencies
        working-directory: ./app
        run: npm ci

      # cg.exe goes in beside the app (see app/scripts/build-cg.js), and the
      # portable build is the one file you can run from anywhere, no installer.
      - name: Build (Windows, portable)
        working-directory: ./app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --win --publish never
        shell: bash

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-artifacts
          path: app/dist/*-portable.exe
          if-no-files-found: error

  release:
    name: Create Release
    needs: [build-linux, build-macos, build-windows]
    # Only a tag publishes. A run started by hand leaves the builds as downloads of
    # the run and nothing else.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Display Structure
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          # A tag with a suffix (v0.1.0-beta.2, -rc.1) is a pre-release; v0.1.0 is not.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.pacman
            artifacts/**/*.tar.gz
            artifacts/**/*.dmg
            artifacts/**/*-portable.exe
          # Said on every release: what the download actually is, and what it
          # still needs from you before it can build anything on AWS.
          body: |
            ## Two kinds of machine

            A GPU machine rented from AWS by the hour, or a Linux server of your own reached
            over SSH - added from Home, set up and removed each in one dialog. Disconnecting
            AWS deletes everything cg made there, in every region, so nothing is left billing.

            ## Self-contained

            `cg` travels with the app - one program, with the box-side scripts and the Lambda
            built into it, inside the download, so it runs without a checkout. The app still
            holds no AWS logic of its own: it runs `cg`, and `cg` is the only thing that
            decides anything.

            Settings are written to `~/.config/cg/.env`, not next to the app, because an
            installed copy is read-only. A checkout keeps using its own `.env` as before, and
            a checkout beside the app wins over the bundled copy - so running from source
            shows your edits.

            ## Which file

            | | |
            |---|---|
            | `.pacman` | Arch, CachyOS, Omarchy - `sudo pacman -U <file>` |
            | `.deb` | Debian, Ubuntu, Mint - `sudo dpkg -i <file>` |
            | `.tar.gz` | anything else - extract it and run `cg` inside |
            | `.AppImage` | one file, but it needs FUSE 2 on the machine |
            | `-mac-x64.dmg` / `-mac-arm64.dmg` | macOS - Intel, or Apple Silicon (M1 and later) |
            | `-win-portable.exe` | Windows - one file, no installer, run it from anywhere |

            The AppImage is listed last on purpose. AppImage type-2 needs `libfuse.so.2`, which
            distributions have largely moved past - on Arch that means `pacman -S fuse2` first,
            or running it as `./cg-*.AppImage --appimage-extract-and-run`. The `.tar.gz` needs
            nothing at all.

            ## Before it can play

            Everything is asked when you add a machine. A server of your own needs an SSH
            login and Tailscale on this computer; AWS also needs an AWS account and a
            Tailscale auth key. From a terminal:

                ./cg check --fix

            ## macOS and Windows: what has been tried

            `cg` itself has been run through a whole cycle on a real Mac (Intel) and a real
            Windows PC: build the machine, check it, save the library, play, delete it, delete
            everything, and nothing left billing. These two downloads are the desktop app
            around it, and the app on those systems has been built but not yet used by a person
            on them - treat them as a first try, and say what breaks.

            - **Not signed.** macOS will say the app is from an unidentified developer: open it
              with right-click > Open, or run `xattr -cr /Applications/cg.app` once.
              Windows SmartScreen will say the same: More info > Run anyway.
            - **Moonlight is not bundled.** Install it (the stream itself); the app finds it in
              its usual place. `cg check --fix` can install it with `brew` or `winget`.
            - **Stop is abrupt on Windows.** There is no Ctrl+C to send, so Stop ends `cg` where
              it stands; run the same command again to carry on.

            From source on any platform: `cd app && npm install && npm start`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
