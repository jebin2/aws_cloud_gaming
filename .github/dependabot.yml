# One pull request a month per ecosystem, grouped, so updates arrive as a batch to
# read and not as a stream. Nothing merges by itself: the Tests workflow runs on
# each pull request, and a person decides.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      go-modules: { patterns: ['*'] }

  - package-ecosystem: npm
    directory: /app
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    # Minor and patch only. A major bump of the app's build tools is not safe to
    # merge on a green check: Tailwind 3 -> 4 removed the `tailwindcss` command that
    # `npm run build:css` calls, and no test builds the CSS, so CI passed on a PR that
    # would have broken `npm start`, `npm run dist` and the release. Electron and
    # electron-builder majors need a packaged build and a look at the GPU workaround.
    # Those are done by hand, on purpose; this stops them arriving as a surprise.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      app-packages: { patterns: ['*'] }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      actions: { patterns: ['*'] }
